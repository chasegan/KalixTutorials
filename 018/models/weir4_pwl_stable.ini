[kalix]
start = 1990-01-01
end = 1999-12-31

[inputs]
^/data/inflows.csv
^/data/orders.csv

[node.001_inflow]
type = inflow
loc = 0, 0
inflow = data.inflows_csv.by_name.inflow
ds_1 = 002_dam

[node.002_dam]
type = storage
loc = 0, 40
initial_volume = 80000
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             100.0    , 0          , 0         , 0,
             105.0    , 5000       , 1.0       , 0,
             110.0    , 20000      , 3.0       , 0,
             115.0    , 50000      , 6.0       , 0,
             120.0    , 100000     , 10.0      , 0,
             120.5    , 105000     , 10.5      , 1e6,
             121.0    , 110000     , 11.0      , 1e8,
ds_1 = 003_routing

[node.003_routing]
type = routing
loc = 0, 80
lag = 2
typical_regulated_flow = 100
pwl = 0,5, 30,3, 50,2.7, 100,0.2, 200,0.05, 500,0.01, 1000,0, 2000,0
ds_1 = 004_weir_orders

# steady-state reach storage: the integral of the pwl travel times
[table.reach_storage]
values = 0,0, 15,67.5, 30,120, 40,149.25, 50,177, 75,228.875, 100,249.5,
         150,257.625, 200,262, 350,268, 500,271, 750,272.875, 1000,273.5, 2000,273.5,

[node.004_weir_orders]
type = order_control
loc = 0, 120
set_order = {
      target = 510;
      v_yesterday = node.005_weir.volume[-1, 510];
      release_today = node.005_weir.ds_1_order;
      release_forecast = moving_max(node.005_weir.ds_1_order, 5, 0);
      in_transit = this.set_order[-1, 0] + this.set_order[-2, 0];
      q_now = node.003_routing.ds_1[-1, 0];
      q_future = max(moving_max(node.002_dam.ds_1[-1, 0], 5, 0), release_forecast);
      reach_adjust = table.reach_storage(q_future) - table.reach_storage(q_now);
      max(0, target - v_yesterday + release_today + 2 * release_forecast - in_transit + reach_adjust)
    }
ds_1 = 005_weir

[node.005_weir]
type = storage
loc = 0, 160
initial_volume = 510
dimensions = Level [m], Volume [ML], Area [km2], Spill [ML],
             270.0    , 0          , 0         , 0,
             273.0    , 200        , 0.14      , 0,
             274.5    , 400        , 0.20      , 0,
             275.0    , 486        , 0.22      , 0,
             275.15   , 510        , 0.23      , 0,
             276.0    , 700        , 0.28      , 0,
             276.4    , 850        , 0.30      , 0,
             276.5    , 890        , 0.31      , 1e6,
             278.0    , 1400       , 0.40      , 1e8,
ds_1_outlet = 275.0
ds_1 = 006_demand

[node.006_demand]
type = order_control
loc = 0, 200
set_order = data.orders_csv.by_name.orders
ds_1 = 007_gauge

[node.007_gauge]
type = gauge
loc = 0, 240

[var.results]
shortfall = max(0, node.006_demand.set_order - node.006_demand.ds_1)

[outputs]
node.002_dam.volume
node.002_dam.ds_1
node.003_routing.ds_1
node.004_weir_orders.set_order
node.005_weir.volume
node.005_weir.level
node.005_weir.ds_1
node.006_demand.set_order
node.006_demand.ds_1
var.results.shortfall
